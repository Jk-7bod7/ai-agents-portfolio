<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <rect width="1600" height="900" fill="#0b1020"/>
  <rect x="55" y="55" width="1490" height="790" rx="28" fill="#111a2e" stroke="#263b63" stroke-width="3"/>
  <text x="110" y="145" fill="#f8fafc" font-family="Arial, sans-serif" font-size="54" font-weight="700">AI Email Assistant</text>
  <text x="112" y="195" fill="#91a4c6" font-family="Arial, sans-serif" font-size="26">n8n + Ollama • Draft-only workflow • Synthetic demo data</text>
  <g font-family="Arial, sans-serif">
    <rect x="105" y="315" width="240" height="150" rx="18" fill="#192946" stroke="#4f8cff" stroke-width="3"/>
    <text x="225" y="370" text-anchor="middle" fill="#b9d2ff" font-size="22">Mock Email</text>
    <text x="225" y="410" text-anchor="middle" fill="#f8fafc" font-size="18">subject + body</text>
    <rect x="405" y="315" width="240" height="150" rx="18" fill="#192946" stroke="#4f8cff" stroke-width="3"/>
    <text x="525" y="370" text-anchor="middle" fill="#b9d2ff" font-size="22">Normalize</text>
    <text x="525" y="410" text-anchor="middle" fill="#f8fafc" font-size="18">validate + clean</text>
    <rect x="705" y="285" width="280" height="210" rx="18" fill="#172d3a" stroke="#45d6a2" stroke-width="3"/>
    <text x="845" y="350" text-anchor="middle" fill="#9bf1cf" font-size="22">AI Analysis</text>
    <text x="845" y="392" text-anchor="middle" fill="#f8fafc" font-size="18">intent • priority</text>
    <text x="845" y="425" text-anchor="middle" fill="#f8fafc" font-size="18">sentiment • request</text>
    <text x="845" y="458" text-anchor="middle" fill="#f8fafc" font-size="18">Ollama local model</text>
    <rect x="1045" y="315" width="240" height="150" rx="18" fill="#192946" stroke="#4f8cff" stroke-width="3"/>
    <text x="1165" y="370" text-anchor="middle" fill="#b9d2ff" font-size="22">Draft Reply</text>
    <text x="1165" y="410" text-anchor="middle" fill="#f8fafc" font-size="18">structured JSON</text>
    <rect x="1345" y="315" width="150" height="150" rx="18" fill="#382b22" stroke="#f2b764" stroke-width="3"/>
    <text x="1420" y="370" text-anchor="middle" fill="#ffd89b" font-size="21">Review</text>
    <text x="1420" y="410" text-anchor="middle" fill="#f8fafc" font-size="17">human gate</text>
    <path d="M345 390 H405 M645 390 H705 M985 390 H1045 M1285 390 H1345" stroke="#83aefc" stroke-width="5" fill="none" marker-end="url(#arrow)"/>
    <rect x="170" y="635" width="1260" height="100" rx="16" fill="#0d1729" stroke="#263b63" stroke-width="2"/>
    <text x="800" y="680" text-anchor="middle" fill="#f8fafc" font-size="22">Safety: no external email sent • no real customer data • no API keys</text>
    <text x="800" y="715" text-anchor="middle" fill="#91a4c6" font-size="18">Every result is a reviewable draft with transparent fallback behavior</text>
  </g>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#83aefc"/></marker></defs>
</svg>
